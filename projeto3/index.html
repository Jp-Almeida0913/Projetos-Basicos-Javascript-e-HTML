<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
</head>
<body>
    <div>
    <p>Primeiro Número <input type="number" id="firstNumber"></p>
    <p>Segundo Número <input type="number" id="secondNumber"></p>
    

    <button value="soma" id="soma">+</button>
    <button value="subtracao" id="subtracao">-</button>
    <button value="multiplicacao" id="multiplicacao">X</button>
    <button value="divisao" id="divisao">/</button>
    </div>

    <h2>Resultado -> </h2>
    <p id="resultado"></p>
</body>
<script src="script.js"></script>
</html>
