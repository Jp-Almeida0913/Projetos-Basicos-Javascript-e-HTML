<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Números Aleatorios</title>
</head>
<body>
    <h1>Sorteador de Números Aleatorios</h1>
    <label> Insira um número minimo e um máximo para ser sorteado um valor entre eles:<br><br></label>
    <input type="number" id="minimo" placeholder="Minimo">
    <input type="number" id="maximo" placeholder="Maximo">
    <br><br>
    <button type="submit" id="btn">Sortear</button>
    <br><br><br>
    <h2 id="resultado"></h2>
</body>
<script src="script.js"></script>
</html>
